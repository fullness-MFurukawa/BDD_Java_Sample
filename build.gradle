plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.jetbrains.kotlin.jvm'
}

group = 'jp.co.fullness.bdd'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	implementation group: 'org.yaml', name: 'snakeyaml', version: '2.2'
	implementation group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.17.2'

	implementation group: 'io.cucumber', name: 'cucumber-spring', version: '7.18.1'
	implementation group: 'io.cucumber', name: 'cucumber-java', version: '7.18.1'
	implementation group: 'io.cucumber', name: 'cucumber-junit', version: '7.18.1'
	implementation group: 'io.cucumber', name: 'cucumber-junit-platform-engine', version: '7.18.1'

	// JUnit Jupiter (JUnit 5)の依存定義
	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
	testImplementation 'org.junit.vintage:junit-vintage-engine'
	testImplementation 'org.junit.platform:junit-platform-launcher:1.9.1'
	testImplementation 'org.junit.platform:junit-platform-suite:1.9.1'
	implementation 'org.junit.platform:junit-platform-commons:1.9.1'

	// https://mvnrepository.com/artifact/nz.net.ultraq.thymeleaf/thymeleaf-layout-dialect
	implementation group: 'nz.net.ultraq.thymeleaf', name: 'thymeleaf-layout-dialect', version: '3.3.0'

	// E2Eテスト
	// https://mvnrepository.com/artifact/com.microsoft.playwright/playwright
	implementation group: 'com.microsoft.playwright', name: 'playwright', version: '1.48.0'
	implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}

tasks.named('test') {
	useJUnitPlatform()
}

task installPlaywright(type: Exec) {
	commandLine 'npx', 'playwright', 'install'
}

build.dependsOn installPlaywright
