<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="ja"
      layout:decorate="~{commons/layout}">
<head></head>
<body>
<div layout:fragment="content">
    <div class="row">
        <div class="col-md-3"></div>
        <div class="col-md-6">
            <div class="text-center">
                <h2 th:text="#{title.product.update.end}"></h2>
                <p>
                <h4>以下の商品を変更しました。</h4>
                <h4 th:text="'商品: ' + ${product.productName.value} + ' 単価: ' + ${product.productPrice.value}"></h4>
                </p>
                <form class="form-inline d-inline-block my-2 my-lg-0" th:action="@{/exercise/product/update}" method="post">
                    <div class="row mb-3">
                        <div class="text-center">
                            <button type="submit" name="end" class="btn btn-primary" th:text="#{button.end}"></button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="col-md-3"></div>
    </div>
</div>
</body>
</html>
